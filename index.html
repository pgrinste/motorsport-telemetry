<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SUZUKA // Telemetry &amp; Predictive Line</title>
<link href="lib/cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  :root{--bg:#0b1220;--panel:rgba(13,20,36,.9);--line:#22304f;--txt:#dbe4f5;--dim:#7c8db0;--acc:#4da3ff;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
  #cesiumContainer{position:absolute;inset:0}
  .cesium-viewer-bottom{background:transparent!important}
  #panel{position:absolute;top:14px;left:14px;width:272px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;backdrop-filter:blur(10px);z-index:10}
  #panel h1{font-size:15px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
  #panel .sub{color:var(--dim);font-size:11px;margin-top:4px;line-height:1.55}
  .sec{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .h{display:block;font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:7px}
  .lapbtns{display:flex;gap:6px}
  .lapbtns button,#trackBtn,#liveBtn{flex:1;background:#152039;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 0;font-size:12px;cursor:pointer;transition:.15s}
  .lapbtns button:hover,#trackBtn:hover,#liveBtn:hover{border-color:var(--acc)}
  .lapbtns button.on{background:var(--acc);color:#04101f;border-color:var(--acc);font-weight:600}
  #trackBtn.on,#liveBtn.on{background:var(--acc);color:#04101f;font-weight:600}
  .chk{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0;cursor:pointer;color:var(--txt)}
  .chk input{accent-color:var(--acc)}
  #speedRow{display:flex;align-items:center;gap:8px}
  #speedSlider{flex:1;accent-color:var(--acc)}
  #speedVal{font-size:12px;color:var(--dim);width:34px;text-align:right}
  .legend{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:6px}
  .legend i{flex:1}
  .leglbl{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:3px}
  #hud{position:absolute;top:14px;right:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;z-index:10;min-width:190px;backdrop-filter:blur(10px)}
  #hud .spd{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  #hud .spd small{font-size:12px;color:var(--dim);font-weight:400;margin-left:4px}
  #hud .row{display:flex;justify-content:space-between;font-size:12px;margin-top:7px;color:var(--dim)}
  #hud .row b{color:var(--txt);font-variant-numeric:tabular-nums;font-weight:600}
  #gapPos{color:#e74c3c!important}#gapNeg{color:#2ecc71!important}
  #chartWrap{position:absolute;right:14px;bottom:58px;width:400px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;z-index:9;backdrop-filter:blur(10px)}
  #chartWrap .h{margin-bottom:2px}
  canvas#chart{width:380px;height:150px;display:block}
  #liveDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5a6b8f;margin-right:6px;vertical-align:middle}
  #liveDot.on{background:#2ecc71;box-shadow:0 0 8px #2ecc71}
</style>
</head>
<body>
<div id="cesiumContainer"></div>

<div id="panel">
  <h1>Suzuka // Telemetry</h1>
  <div class="sub">Physics ideal line &amp; delta analytics — OSM geometry, real SRTM elevation, Monte&nbsp;Carlo uncertainty (4096 samples, RTX&nbsp;4090).</div>

  <div class="sec"><span class="h">Delta heatmap lap</span>
    <div class="lapbtns" id="lapBtns">
      <button data-lap="1" class="on">Lap 1</button><button data-lap="2">Lap 2</button><button data-lap="3">Lap 3</button>
    </div>
    <div class="legend"><i style="background:#2ecc71"></i><i style="background:#26303e"></i><i style="background:#e74c3c"></i></div>
    <div class="leglbl"><span>ahead of ideal</span><span>behind ideal</span></div>
  </div>

  <div class="sec"><span class="h">Layers</span>
    <label class="chk"><input type="checkbox" id="lyrDelta" checked> Delta heatmap (3D ribbon)</label>
    <label class="chk"><input type="checkbox" id="lyrTrail" checked> Driver trail</label>
    <label class="chk"><input type="checkbox" id="lyrGhost" checked> Ideal-line ghost car</label>
    <label class="chk"><input type="checkbox" id="lyrCorners" checked> Corner labels</label>
  </div>

  <div class="sec"><span class="h">Camera &amp; playback</span>
    <button id="trackBtn">Track driver</button>
    <div id="speedRow" style="margin-top:8px">
      <input type="range" id="speedSlider" min="1" max="60" value="4"/>
      <span id="speedVal">×4</span>
    </div>
  </div>

  <div class="sec"><button id="liveBtn"><span id="liveDot"></span>LIVE stream (WebSocket)</button></div>
</div>

<div id="hud">
  <div class="spd"><span id="hSpeed">—</span><small>km/h</small></div>
  <div class="row"><span>LAP</span><b id="hLap">–</b></div>
  <div class="row"><span>GAP vs ideal</span><b id="hGap">–</b></div>
  <div class="row"><span>TIME</span><b id="hTime">0:00.0</b></div>
</div>

<div id="chartWrap">
  <span class="h">Speed profile — km/h vs track position</span>
  <canvas id="chart" width="760" height="300"></canvas>
</div>

<script>window.CESIUM_BASE_URL = "lib/cesium/";</script>
<script src="lib/cesium/Cesium.js"></script>
<script src="js/app.js?v=20260916c"></script>
</body>
</html>
